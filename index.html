<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Video Maker</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b1020;
  color: white;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

h1 {
  text-align: center;
  font-size: 32px;
}

.subtitle {
  text-align: center;
  color: #aeb7cc;
}

.card {
  background: #151c30;
  padding: 20px;
  border-radius: 18px;
  margin-top: 20px;
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 8px;
  font-weight: bold;
}

textarea,
select {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #39435e;
  background: #0d1324;
  color: white;
  font-size: 16px;
}

textarea {
  height: 180px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  border: none;
  border-radius: 12px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.create {
  background: #7c3aed;
  color: white;
}

.imageButton {
  background: #db2777;
  color: white;
}

.voice {
  background: #2563eb;
  color: white;
}

.download {
  background: #16a34a;
  color: white;
}

.scene {
  padding: 15px;
  margin-top: 15px;
  border-radius: 14px;
  background: #202a45;
}

.scene-number {
  font-size: 14px;
  color: #cbd5ff;
}

.scene-text {
  margin-top: 8px;
  font-size: 17px;
  line-height: 1.5;
}

.scene img {
  width: 100%;
  margin-top: 12px;
  border-radius: 12px;
  display: block;
}

.status {
  text-align: center;
  color: #aeb7cc;
  margin-top: 15px;
}

#videoPreview {
  width: 100%;
  margin-top: 20px;
  border-radius: 15px;
  display: none;
}

</style>

<script src="https://js.puter.com/v2/"></script>

</head>

<body>

<div class="container">

<h1>🎬 AI Video Maker</h1>

<p class="subtitle">
Turn your story into an illustrated video
</p>

<div class="card">

<label>📝 Your Story</label>

<textarea
id="story"
placeholder="Write your story here..."></textarea>

<label>🎨 Video Style</label>

<select id="style">
<option>Cartoon</option>
<option>Fantasy</option>
<option>Adventure</option>
<option>Kids Story</option>
<option>Realistic</option>
</select>

<label>🎬 Number of Scenes</label>

<select id="sceneCount">
<option value="3">3 scenes</option>
<option value="5" selected>5 scenes</option>
<option value="8">8 scenes</option>
</select>

<button class="create" onclick="createScenes()">
✨ Create Scenes
</button>

<button class="imageButton" onclick="generateImages()">
🖼️ Generate AI Scene Images
</button>

<p class="status" id="status">
Write your story and create scenes.
</p>

<div id="result"></div>

<button class="voice" onclick="readStory()">
🔊 Play Voice
</button>

<button class="download" onclick="createVideoFile()">
🎬 Create & Download Video
</button>

<video id="videoPreview" controls></video>

</div>

</div>

<script>

let scenes = [];
let images = [];


/* CREATE SCENES */

function createScenes() {

  const story =
    document.getElementById("story").value.trim();

  const style =
    document.getElementById("style").value;

  const count =
    Number(document.getElementById("sceneCount").value);

  if (!story) {
    alert("Please write your story first.");
    return;
  }

  const sentences = story
    .split(/[.!?]+/)
    .map(s => s.trim())
    .filter(Boolean);

  scenes = [];
  images = [];

  const result =
    document.getElementById("result");

  result.innerHTML = "";

  for (let i = 0; i < count; i++) {

    const text =
      sentences.length > 0
      ? sentences[i % sentences.length]
      : story;

    scenes.push(text);

    const scene =
      document.createElement("div");

    scene.className = "scene";

    scene.innerHTML = `
      <div class="scene-number">
        🎬 Scene ${i + 1} • ${style}
      </div>

      <div class="scene-text">
        ${escapeHTML(text)}
      </div>

      <div class="image-container"></div>
    `;

    result.appendChild(scene);
  }

  document.getElementById("status").textContent =
    "✨ Scenes are ready!";
}


/* GENERATE AI IMAGES */

async function generateImages() {

  if (scenes.length === 0) {
    createScenes();
  }

  if (scenes.length === 0) {
    return;
  }

  const style =
    document.getElementById("style").value;

  const containers =
    document.querySelectorAll(".image-container");

  images = [];

  document.getElementById("status").textContent =
    "🖼️ Starting AI image generation...";

  for (let i = 0; i < scenes.length; i++) {

    const prompt =
      `${style} children's story illustration. `
      + `Beautiful colorful scene. `
      + `Friendly characters. `
      + `High quality. `
      + `${scenes[i]}`;

    try {

      document.getElementById("status").textContent =
        `🖼️ Creating image ${i + 1} of ${scenes.length}...`;

      const image =
        await puter.ai.txt2img(prompt);

      const img =
        document.createElement("img");

      if (typeof image === "string") {
        img.src = image;
      } else if (image && image.src) {
        img.src = image.src;
      } else if (image && image.url) {
        img.src = image.url;
      }

      img.alt = "AI scene " + (i + 1);

      containers[i].appendChild(img);

      images.push(img);

    } catch (error) {

      console.error(error);

      alert(
        "The image could not be generated. Please try again."
      );

      document.getElementById("status").textContent =
        "❌ Image generation stopped.";

      return;
    }
  }

  document.getElementById("status").textContent =
    "✅ All scene images are ready!";
}


/* PLAY VOICE */

function readStory() {

  const story =
    document.getElementById("story").value.trim();

  if (!story) {
    alert("Please write your story first.");
    return;
  }

  if (!("speechSynthesis" in window)) {
    alert("Voice is not supported by this browser.");
    return;
  }

  speechSynthesis.cancel();

  const voice =
    new SpeechSynthesisUtterance(story);

  voice.rate = 0.9;
  voice.pitch = 1;

  speechSynthesis.speak(voice);
}


/* WAIT FOR IMAGE */

function waitForImage(img) {

  return new Promise((resolve, reject) => {

    if (img.complete && img.naturalWidth > 0) {
      resolve();
      return;
    }

    img.onload = () => resolve();

    img.onerror = () =>
      reject(new Error("Image failed to load."));
  });
}


/* DRAW IMAGE TO CANVAS */

function drawImageCover(ctx, img, canvas) {

  const canvasWidth = canvas.width;
  const canvasHeight = canvas.height;

  const imageWidth = img.naturalWidth;
  const imageHeight = img.naturalHeight;

  const scale = Math.max(
    canvasWidth / imageWidth,
    canvasHeight / imageHeight
  );

  const width = imageWidth * scale;
  const height = imageHeight * scale;

  const x = (canvasWidth - width) / 2;
  const y = (canvasHeight - height) / 2;

  ctx.drawImage(
    img,
    x,
    y,
    width,
    height
  );
}


/* CREATE VIDEO */

async function createVideoFile() {

  if (images.length === 0) {

    alert(
      "First generate the AI scene images."
    );

    return;
  }

  if (!HTMLCanvasElement.prototype.captureStream) {

    alert(
      "Your browser does not support video recording. Please use Chrome."
    );

    return;
  }

  const status =
    document.getElementById("status");

  status.textContent =
    "🎬 Preparing your video...";

  const canvas =
    document.createElement("canvas");

  canvas.width = 720;
  canvas.height = 1280;

  const ctx =
    canvas.getContext("2d");

  let stream;

  try {

    stream =
      canvas.captureStream(30);

  } catch (error) {

    alert(
      "Your browser could not start video recording."
    );

    return;
  }

  let mimeType = "";

  if (MediaRecorder.isTypeSupported("video/webm;codecs=vp9")) {

    mimeType =
      "video/webm;codecs=vp9";

  } else if (MediaRecorder.isTypeSupported("video/webm")) {

    mimeType =
      "video/webm";

  } else {

    alert(
      "This browser cannot create a downloadable video."
    );

    return;
  }

  const recorder =
    new MediaRecorder(
      stream,
      { mimeType: mimeType }
    );

  const chunks = [];

  recorder.ondataavailable = event => {

    if (event.data.size > 0) {
      chunks.push(event.data);
    }

  };

  const finished =
    new Promise(resolve => {

      recorder.onstop = resolve;

    });

  recorder.start();

  try {

    for (let i = 0; i < images.length; i++) {

      const img = images[i];

      status.textContent =
        `🎬 Creating scene ${i + 1} of ${images.length}...`;

      await waitForImage(img);

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      /* Draw AI image */

      drawImageCover(
        ctx,
        img,
        canvas
      );

      /* Dark overlay at bottom */

      const gradient =
        ctx.createLinearGradient(
          0,
          canvas.height - 350,
          0,
          canvas.height
        );

      gradient.addColorStop(
        0,
        "rgba(0,0,0,0)"
      );

      gradient.addColorStop(
        1,
        "rgba(0,0,0,0.8)"
      );

      ctx.fillStyle = gradient;

      ctx.fillRect(
        0,
        canvas.height - 350,
        canvas.width,
        350
      );

      /* Scene text */

      ctx.fillStyle = "white";

      ctx.font =
        "bold 34px Arial";

      ctx.textAlign = "center";

      const text =
        scenes[i];

      drawWrappedText(
        ctx,
        text,
        canvas.width / 2,
        canvas.height - 150,
        620,
        42
      );

      /* Keep scene for 4 seconds */

      await sleep(4000);
    }

    recorder.stop();

    await finished;

  } catch (error) {

    console.error(error);

    recorder.stop();

    status.textContent =
      "❌ Video creation failed.";

    alert(
      "Something went wrong while creating the video."
    );

    return;
  }

  const videoBlob =
    new Blob(
      chunks,
      { type: mimeType }
    );

  const videoURL =
    URL.createObjectURL(videoBlob);

  /* Show preview */

  const preview =
    document.getElementById("videoPreview");

  preview.src =
    videoURL;

  preview.style.display =
    "block";

  /* Download */

  const link =
    document.createElement("a");

  link.href =
    videoURL;

  link.download =
    "my-ai-video.webm";

  document.body.appendChild(link);

  link.click();

  document.body.removeChild(link);

  status.textContent =
    "✅ Your video is ready and downloading!";
}


/* WRAP TEXT */

function drawWrappedText(
  ctx,
  text,
  x,
  y,
  maxWidth,
  lineHeight
) {

  const words =
    text.split(" ");

  let line = "";

  const lines = [];

  for (let n = 0; n < words.length; n++) {

    const testLine =
      line + words[n] + " ";

    const metrics =
      ctx.measureText(testLine);

    if (
      metrics.width > maxWidth &&
      n > 0
    ) {

      lines.push(line);

      line =
        words[n] + " ";

    } else {

      line =
        testLine;
    }
  }

  lines.push(line);

  const startY =
    y - ((lines.length - 1) * lineHeight) / 2;

  lines.forEach((line, index) => {

    ctx.fillText(
      line,
      x,
      startY + index * lineHeight
    );

  });
}


/* DELAY */

function sleep(ms) {

  return new Promise(
    resolve => setTimeout(resolve, ms)
  );

}


/* ESCAPE HTML */

function escapeHTML(text) {

  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
