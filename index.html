<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Video Maker</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b1020;
  color: white;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

h1 {
  text-align: center;
  font-size: 32px;
}

.subtitle {
  text-align: center;
  color: #aeb7cc;
}

.card {
  background: #151c30;
  padding: 20px;
  border-radius: 18px;
  margin-top: 20px;
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 8px;
  font-weight: bold;
}

textarea,
select,
input {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #39435e;
  background: #0d1324;
  color: white;
  font-size: 16px;
}

textarea {
  height: 180px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  border: none;
  border-radius: 12px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.create {
  background: #7c3aed;
  color: white;
}

.imageButton {
  background: #db2777;
  color: white;
}

.voice {
  background: #2563eb;
  color: white;
}

.download {
  background: #16a34a;
  color: white;
}

.scene {
  padding: 15px;
  margin-top: 15px;
  border-radius: 14px;
  background: #202a45;
}

.scene img {
  width: 100%;
  border-radius: 12px;
  margin-top: 10px;
  display: block;
}

.scene-number {
  font-size: 14px;
  color: #cbd5ff;
}

.scene-text {
  margin-top: 8px;
  font-size: 17px;
  line-height: 1.5;
}

.status {
  text-align: center;
  color: #aeb7cc;
  margin-top: 15px;
}

#videoPreview {
  width: 100%;
  margin-top: 20px;
  border-radius: 14px;
  display: none;
}
</style>
</head>

<body>

<div class="container">

<h1>🎬 AI Video Maker</h1>

<p class="subtitle">
Turn your story into an illustrated video
</p>

<div class="card">

<label>🔑 AI Image API Key</label>

<input
id="apiKey"
type="password"
placeholder="Paste your API key here">

<p class="status">
Your key is used only by this browser.
</p>

<label>📝 Your Story</label>

<textarea
id="story"
placeholder="Write your story here..."></textarea>

<label>🎨 Video Style</label>

<select id="style">
<option>Cartoon</option>
<option>Fantasy</option>
<option>Adventure</option>
<option>Kids Story</option>
<option>Realistic</option>
</select>

<label>🎬 Number of Scenes</label>

<select id="sceneCount">
<option value="3">3 scenes</option>
<option value="5" selected>5 scenes</option>
<option value="8">8 scenes</option>
</select>

<button class="create" onclick="createScenes()">
✨ Create Scenes
</button>

<button class="imageButton" onclick="generateImages()">
🖼️ Generate AI Scene Images
</button>

<p class="status" id="status">
Your scenes will appear below.
</p>

<div id="result"></div>

<video id="videoPreview" controls></video>

<button class="voice" onclick="readStory()">
🔊 Play Voice
</button>

<button class="download" onclick="createVideoFile()">
🎬 Create & Download Video
</button>

</div>

</div>

<script>

let scenes = [];
let sceneImages = [];


/* CREATE SCENES */

function createScenes() {

  const story =
    document.getElementById("story").value.trim();

  const style =
    document.getElementById("style").value;

  const count =
    Number(document.getElementById("sceneCount").value);

  if (!story) {
    alert("Please write your story first.");
    return;
  }

  const sentences = story
    .split(/[.!?]+/)
    .map(s => s.trim())
    .filter(Boolean);

  scenes = [];
  sceneImages = [];

  const result =
    document.getElementById("result");

  result.innerHTML = "";

  for (let i = 0; i < count; i++) {

    const text =
      sentences.length > 0
      ? sentences[i % sentences.length]
      : story;

    scenes.push(text);

    const scene =
      document.createElement("div");

    scene.className = "scene";

    scene.innerHTML = `
      <div class="scene-number">
        🎬 Scene ${i + 1} • ${style}
      </div>

      <div class="scene-text">
        ${escapeHTML(text)}
      </div>

      <div class="scene-image-container">
      </div>
    `;

    result.appendChild(scene);
  }

  document.getElementById("status").textContent =
    "✨ Scenes created! Now generate the images.";
}


/* GENERATE AI IMAGES */

async function generateImages() {

  const apiKey =
    document.getElementById("apiKey").value.trim();

  const style =
    document.getElementById("style").value;

  if (!apiKey) {
    alert("Please enter your AI image API key first.");
    return;
  }

  if (scenes.length === 0) {
    createScenes();
  }

  if (scenes.length === 0) {
    return;
  }

  const sceneBoxes =
    document.querySelectorAll(
      ".scene-image-container"
    );

  sceneImages = [];

  document.getElementById("status").textContent =
    "🖼️ Generating AI images...";

  for (let i = 0; i < scenes.length; i++) {

    const prompt =
      `${style} children's story illustration, `
      + `beautiful colorful scene, `
      + `friendly characters, `
      + `cinematic composition, `
      + `high quality, `
      + `${scenes[i]}`;

    try {

      const imageURL =
        "https://gen.pollinations.ai/image/"
        + encodeURIComponent(prompt)
        + "?model=flux"
        + "&width=720"
        + "&height=1280"
        + "&key="
        + encodeURIComponent(apiKey);

      const img =
        document.createElement("img");

      img.src = imageURL;

      img.alt =
        "AI generated scene " + (i + 1);

      img.onload = function() {

        document.getElementById("status").textContent =
          `🖼️ Generated ${i + 1} of ${scenes.length} images`;

      };

      img.onerror = function() {

        document.getElementById("status").textContent =
          "❌ An image could not be generated.";

      };

      sceneBoxes[i].appendChild(img);

      sceneImages.push(imageURL);

      await wait(1500);

    } catch (error) {

      console.error(error);

      alert(
        "There was a problem generating the image."
      );

      return;
    }
  }

  document.getElementById("status").textContent =
    "✅ All scene images are ready!";
}


/* VOICE */

function readStory() {

  const story =
    document.getElementById("story").value.trim();

  if (!story) {
    alert("Please write your story first.");
    return;
  }

  if (!("speechSynthesis" in window)) {
    alert("Voice is not supported by this browser.");
    return;
  }

  speechSynthesis.cancel();

  const voice =
    new SpeechSynthesisUtterance(story);

  voice.rate = 0.9;
  voice.pitch = 1;

  speechSynthesis.speak(voice);
}


/* VIDEO */

async function createVideoFile() {

  if (sceneImages.length === 0) {

    alert(
      "Please generate the AI scene images first."
    );

    return;
  }

  alert(
    "Your AI images are ready. The next version will combine them into the final video."
  );
}


/* ESCAPE TEXT */

function escapeHTML(text) {

  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* WAIT */

function wait(ms) {

  return new Promise(
    resolve =>
      setTimeout(resolve, ms)
  );
}

</script>

</body>
</html>
