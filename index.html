<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Video Maker</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b1020;
  color: white;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

h1 {
  text-align: center;
  font-size: 32px;
}

.subtitle {
  text-align: center;
  color: #aeb7cc;
}

.card {
  background: #151c30;
  padding: 20px;
  border-radius: 18px;
  margin-top: 20px;
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 8px;
  font-weight: bold;
}

textarea,
select {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #39435e;
  background: #0d1324;
  color: white;
  font-size: 16px;
}

textarea {
  height: 180px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  border: none;
  border-radius: 12px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.create {
  background: #7c3aed;
  color: white;
}

.voice {
  background: #2563eb;
  color: white;
}

.download {
  background: #16a34a;
  color: white;
}

.scene {
  padding: 18px;
  margin-top: 12px;
  border-radius: 14px;
  background: linear-gradient(135deg, #263b73, #542d64);
}

.scene-number {
  font-size: 14px;
  color: #cbd5ff;
}

.scene-text {
  margin-top: 8px;
  font-size: 17px;
  line-height: 1.5;
}

.status {
  text-align: center;
  color: #aeb7cc;
  margin-top: 15px;
}

#videoPreview {
  width: 100%;
  margin-top: 20px;
  border-radius: 14px;
  display: none;
  background: black;
}
</style>
</head>

<body>

<div class="container">

<h1>🎬 AI Video Maker</h1>

<p class="subtitle">
Turn your story into a video
</p>

<div class="card">

<label>📝 Your Story</label>

<textarea
id="story"
placeholder="Write your story here..."></textarea>

<label>🎨 Video Style</label>

<select id="style">
<option>Cartoon</option>
<option>Fantasy</option>
<option>Adventure</option>
<option>Kids Story</option>
<option>Realistic</option>
</select>

<label>🎬 Number of Scenes</label>

<select id="sceneCount">
<option value="3">3 scenes</option>
<option value="5" selected>5 scenes</option>
<option value="8">8 scenes</option>
</select>

<button class="create" onclick="createScenes()">
✨ Create Scenes
</button>

<p class="status" id="status">
Your scenes will appear below.
</p>

<div id="result"></div>

<canvas id="videoCanvas" width="720" height="1280"
style="display:none;"></canvas>

<video id="videoPreview" controls></video>

<button class="voice" onclick="readStory()">
🔊 Play Voice
</button>

<button class="download" onclick="createVideoFile()">
🎬 Create & Download Video
</button>

</div>

</div>

<script>

let scenes = [];


/* CREATE SCENES */

function createScenes() {

  const story =
    document.getElementById("story").value.trim();

  const style =
    document.getElementById("style").value;

  const count =
    Number(document.getElementById("sceneCount").value);

  if (!story) {
    alert("Please write your story first.");
    return;
  }

  const sentences = story
    .split(/[.!?]+/)
    .map(s => s.trim())
    .filter(Boolean);

  scenes = [];

  const result =
    document.getElementById("result");

  result.innerHTML = "";

  for (let i = 0; i < count; i++) {

    const text =
      sentences.length > 0
      ? sentences[i % sentences.length]
      : story;

    scenes.push(text);

    const scene =
      document.createElement("div");

    scene.className = "scene";

    scene.innerHTML = `
      <div class="scene-number">
        🎬 Scene ${i + 1} • ${style}
      </div>

      <div class="scene-text">
        ${escapeHTML(text)}
      </div>
    `;

    result.appendChild(scene);
  }

  document.getElementById("status").textContent =
    "✨ Your scenes are ready!";
}


/* SAFE TEXT */

function escapeHTML(text) {

  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* VOICE */

function readStory() {

  const story =
    document.getElementById("story").value.trim();

  if (!story) {
    alert("Please write your story first.");
    return;
  }

  if (!("speechSynthesis" in window)) {
    alert("Voice is not supported by this browser.");
    return;
  }

  speechSynthesis.cancel();

  const voice =
    new SpeechSynthesisUtterance(story);

  voice.rate = 0.9;
  voice.pitch = 1;

  speechSynthesis.speak(voice);
}


/* CREATE REAL VIDEO */

async function createVideoFile() {

  if (scenes.length === 0) {

    createScenes();

    if (scenes.length === 0) {
      return;
    }
  }

  if (!window.MediaRecorder) {

    alert(
      "Your browser does not support video recording. Please try Chrome."
    );

    return;
  }

  const canvas =
    document.getElementById("videoCanvas");

  const ctx =
    canvas.getContext("2d");

  const stream =
    canvas.captureStream(30);

  let mimeType = "";

  if (
    MediaRecorder.isTypeSupported(
      "video/webm;codecs=vp9"
    )
  ) {
    mimeType =
      "video/webm;codecs=vp9";
  }

  else if (
    MediaRecorder.isTypeSupported(
      "video/webm;codecs=vp8"
    )
  ) {
    mimeType =
      "video/webm;codecs=vp8";
  }

  else {
    mimeType = "video/webm";
  }

  const recorder =
    new MediaRecorder(
      stream,
      { mimeType: mimeType }
    );

  const chunks = [];

  recorder.ondataavailable = function(event) {

    if (event.data.size > 0) {
      chunks.push(event.data);
    }

  };


  recorder.onstop = function() {

    const blob =
      new Blob(
        chunks,
        { type: mimeType }
      );

    const url =
      URL.createObjectURL(blob);

    const video =
      document.getElementById("videoPreview");

    video.src = url;

    video.style.display = "block";

    const link =
      document.createElement("a");

    link.href = url;

    link.download =
      "my-ai-video.webm";

    document.body.appendChild(link);

    link.click();

    link.remove();

    document.getElementById("status").textContent =
      "✅ Your video is ready!";

  };


  recorder.start();

  document.getElementById("status").textContent =
    "🎬 Creating video...";


  for (let i = 0; i < scenes.length; i++) {

    drawScene(
      ctx,
      scenes[i],
      i + 1,
      scenes.length
    );

    await wait(3000);
  }


  recorder.stop();
}


/* DRAW VIDEO SCENE */

function drawScene(
  ctx,
  text,
  number,
  total
) {

  const width = 720;
  const height = 1280;

  ctx.clearRect(
    0,
    0,
    width,
    height
  );

  const gradient =
    ctx.createLinearGradient(
      0,
      0,
      width,
      height
    );

  gradient.addColorStop(
    0,
    "#263b73"
  );

  gradient.addColorStop(
    1,
    "#542d64"
  );

  ctx.fillStyle = gradient;

  ctx.fillRect(
    0,
    0,
    width,
    height
  );


  ctx.fillStyle = "white";

  ctx.font =
    "bold 42px Arial";

  ctx.textAlign =
    "center";

  ctx.fillText(
    "🎬 AI VIDEO MAKER",
    width / 2,
    100
  );


  ctx.font =
    "bold 30px Arial";

  ctx.fillText(
    "Scene " + number + " / " + total,
    width / 2,
    180
  );


  ctx.font =
    "32px Arial";

  const lines =
    wrapText(
      ctx,
      text,
      580
    );

  let y = 500;

  for (const line of lines) {

    ctx.fillText(
      line,
      width / 2,
      y
    );

    y += 50;
  }

}


/* WRAP TEXT */

function wrapText(
  ctx,
  text,
  maxWidth
) {

  const words =
    text.split(" ");

  const lines = [];

  let line = "";

  for (const word of words) {

    const test =
      line
      ? line + " " + word
      : word;

    const measurement =
      ctx.measureText(test);

    if (
      measurement.width >
      maxWidth
    ) {

      lines.push(line);

      line = word;

    }

    else {

      line = test;

    }

  }

  if (line) {
    lines.push(line);
  }

  return lines;
}


/* WAIT */

function wait(ms) {

  return new Promise(
    resolve =>
      setTimeout(resolve, ms)
  );

}

</script>

</body>
</html>
