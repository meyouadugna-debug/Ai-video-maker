<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Video Maker</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b1020;
  color: white;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

h1 {
  text-align: center;
  font-size: 32px;
}

.subtitle {
  text-align: center;
  color: #aeb7cc;
}

.card {
  background: #151c30;
  padding: 20px;
  border-radius: 18px;
  margin-top: 20px;
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 8px;
  font-weight: bold;
}

textarea,
select {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #39435e;
  background: #0d1324;
  color: white;
  font-size: 16px;
}

textarea {
  height: 180px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  border: none;
  border-radius: 12px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.create {
  background: #7c3aed;
  color: white;
}

.imageButton {
  background: #db2777;
  color: white;
}

.voice {
  background: #2563eb;
  color: white;
}

.download {
  background: #16a34a;
  color: white;
}

.scene {
  padding: 15px;
  margin-top: 15px;
  border-radius: 14px;
  background: #202a45;
}

.scene-number {
  font-size: 14px;
  color: #cbd5ff;
}

.scene-text {
  margin-top: 8px;
  font-size: 17px;
  line-height: 1.5;
}

.scene img {
  width: 100%;
  margin-top: 12px;
  border-radius: 12px;
  display: block;
}

.status {
  text-align: center;
  color: #aeb7cc;
  margin-top: 15px;
}
</style>

<script src="https://js.puter.com/v2/"></script>

</head>

<body>

<div class="container">

<h1>🎬 AI Video Maker</h1>

<p class="subtitle">
Turn your story into illustrated scenes
</p>

<div class="card">

<label>📝 Your Story</label>

<textarea
id="story"
placeholder="Write your story here..."></textarea>

<label>🎨 Video Style</label>

<select id="style">
<option>Cartoon</option>
<option>Fantasy</option>
<option>Adventure</option>
<option>Kids Story</option>
<option>Realistic</option>
</select>

<label>🎬 Number of Scenes</label>

<select id="sceneCount">
<option value="3">3 scenes</option>
<option value="5" selected>5 scenes</option>
<option value="8">8 scenes</option>
</select>

<button class="create" onclick="createScenes()">
✨ Create Scenes
</button>

<button class="imageButton" onclick="generateImages()">
🖼️ Generate AI Scene Images
</button>

<p class="status" id="status">
Write your story and create scenes.
</p>

<div id="result"></div>

<button class="voice" onclick="readStory()">
🔊 Play Voice
</button>

<button class="download" onclick="createVideoFile()">
🎬 Create & Download Video
</button>

</div>

</div>

<script>

let scenes = [];
let images = [];


/* CREATE SCENES */

function createScenes() {

  const story =
    document.getElementById("story").value.trim();

  const style =
    document.getElementById("style").value;

  const count =
    Number(document.getElementById("sceneCount").value);

  if (!story) {
    alert("Please write your story first.");
    return;
  }

  const sentences = story
    .split(/[.!?]+/)
    .map(s => s.trim())
    .filter(Boolean);

  scenes = [];
  images = [];

  const result =
    document.getElementById("result");

  result.innerHTML = "";

  for (let i = 0; i < count; i++) {

    const text =
      sentences.length > 0
      ? sentences[i % sentences.length]
      : story;

    scenes.push(text);

    const scene =
      document.createElement("div");

    scene.className = "scene";

    scene.innerHTML = `
      <div class="scene-number">
        🎬 Scene ${i + 1} • ${style}
      </div>

      <div class="scene-text">
        ${escapeHTML(text)}
      </div>

      <div class="image-container"></div>
    `;

    result.appendChild(scene);
  }

  document.getElementById("status").textContent =
    "✨ Scenes are ready!";
}


/* GENERATE AI IMAGES */

async function generateImages() {

  if (scenes.length === 0) {
    createScenes();
  }

  if (scenes.length === 0) {
    return;
  }

  const style =
    document.getElementById("style").value;

  const containers =
    document.querySelectorAll(".image-container");

  images = [];

  document.getElementById("status").textContent =
    "🖼️ Starting AI image generation...";

  for (let i = 0; i < scenes.length; i++) {

    const prompt =
      `${style} children's story illustration. `
      + `Beautiful colorful scene. `
      + `Friendly characters. `
      + `High quality. `
      + `${scenes[i]}`;

    try {

      document.getElementById("status").textContent =
        `🖼️ Creating image ${i + 1} of ${scenes.length}...`;

      const image =
        await puter.ai.txt2img(prompt);

      const img =
        document.createElement("img");

      if (typeof image === "string") {
        img.src = image;
      } else if (image && image.src) {
        img.src = image.src;
      } else if (image && image.url) {
        img.src = image.url;
      }

      img.alt =
        "AI scene " + (i + 1);

      containers[i].appendChild(img);

      images.push(img);

    } catch (error) {

      console.error(error);

      alert(
        "The image could not be generated. Please try again."
      );

      document.getElementById("status").textContent =
        "❌ Image generation stopped.";

      return;
    }
  }

  document.getElementById("status").textContent =
    "✅ All scene images are ready!";
}


/* VOICE */

function readStory() {

  const story =
    document.getElementById("story").value.trim();

  if (!story) {
    alert("Please write your story first.");
    return;
  }

  if (!("speechSynthesis" in window)) {
    alert("Voice is not supported by this browser.");
    return;
  }

  speechSynthesis.cancel();

  const voice =
    new SpeechSynthesisUtterance(story);

  voice.rate = 0.9;
  voice.pitch = 1;

  speechSynthesis.speak(voice);
}


/* VIDEO PLACEHOLDER */

function createVideoFile() {

  if (images.length === 0) {

    alert(
      "Generate the AI scene images first."
    );

    return;
  }

  alert(
    "Your AI scene images are ready. The next step is combining them into the final video."
  );
}


/* ESCAPE HTML */

function escapeHTML(text) {

  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
