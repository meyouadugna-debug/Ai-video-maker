<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Video Maker</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b1020;
  color: white;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

h1 {
  text-align: center;
  font-size: 32px;
}

.subtitle {
  text-align: center;
  color: #aeb7cc;
}

.card {
  background: #151c30;
  padding: 20px;
  border-radius: 18px;
  margin-top: 20px;
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 8px;
  font-weight: bold;
}

textarea,
select,
input {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #39435e;
  background: #0d1324;
  color: white;
  font-size: 16px;
}

textarea {
  height: 180px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  border: none;
  border-radius: 12px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.create {
  background: #7c3aed;
  color: white;
}

.voice {
  background: #2563eb;
  color: white;
}

.download {
  background: #16a34a;
  color: white;
}

.scene {
  padding: 18px;
  margin-top: 12px;
  border-radius: 14px;
  background: linear-gradient(135deg, #263b73, #542d64);
}

.scene-number {
  font-size: 14px;
  color: #cbd5ff;
}

.scene-text {
  margin-top: 8px;
  font-size: 17px;
  line-height: 1.5;
}

.status {
  text-align: center;
  color: #aeb7cc;
  margin-top: 15px;
}
</style>
</head>

<body>

<div class="container">

  <h1>🎬 AI Video Maker</h1>

  <p class="subtitle">
    Turn your story into scenes
  </p>

  <div class="card">

    <label>📝 Your Story</label>

    <textarea id="story"
      placeholder="Write your story here..."></textarea>

    <label>🎨 Video Style</label>

    <select id="style">
      <option>Cartoon</option>
      <option>Fantasy</option>
      <option>Adventure</option>
      <option>Kids Story</option>
      <option>Realistic</option>
    </select>

    <label>🎬 Number of Scenes</label>

    <select id="sceneCount">
      <option value="3">3 scenes</option>
      <option value="5" selected>5 scenes</option>
      <option value="8">8 scenes</option>
    </select>

    <button class="create" onclick="createVideo()">
      ✨ Create Video
    </button>

    <p class="status" id="status">
      Your scenes will appear below.
    </p>

    <div id="result"></div>

    <button class="voice" onclick="readStory()">
      🔊 Play Voice
    </button>

    <button class="download" onclick="createVideoFile()">
  🎬 Create & Download Video
</button> 
  </button>
    
  </div>

</div>

<script>

function createVideo() {

  const story = document.getElementById("story").value.trim();
  const style = document.getElementById("style").value;
  const count = Number(document.getElementById("sceneCount").value);

  if (!story) {
    alert("Please write your story first.");
    return;
  }

  const sentences = story
    .split(/[.!?]+/)
    .map(s => s.trim())
    .filter(Boolean);

  const result = document.getElementById("result");

  result.innerHTML = "";

  for (let i = 0; i < count; i++) {

    let text;

    if (sentences.length > 0) {
      text = sentences[i % sentences.length];
    } else {
      text = story;
    }

    const scene = document.createElement("div");

    scene.className = "scene";

    scene.innerHTML = `
      <div class="scene-number">
        🎬 Scene ${i + 1} • ${style}
      </div>

      <div class="scene-text">
        ${text}
      </div>
    `;

    result.appendChild(scene);
  }

  document.getElementById("status").textContent =
    "✨ Your video scenes are ready!";
}


function readStory() {

  const story = document.getElementById("story").value.trim();

  if (!story) {
    alert("Please write a story first.");
    return;
  }

  if (!("speechSynthesis" in window)) {
    alert("Voice is not supported by this browser.");
    return;
  }

  speechSynthesis.cancel();

  const voice =
    new SpeechSynthesisUtterance(story);

  voice.rate = 0.9;
  voice.pitch = 1;

  speechSynthesis.speak(voice);
}


function downloadStory() {

  const story = document.getElementById("story").value.trim();

  if (!story) {
    alert("Please write a story first.");
    return;
  }

  const file = new Blob(
    [story],
    {type: "text/plain"}
  );

  const url = URL.createObjectURL(file);

  const link = document.createElement("a");

  link.href = url;
  link.download = "my-video-story.txt";

  link.click();

  URL.revokeObjectURL(url);
}
function createVideoFile() {
  const story = document.getElementById("story").value.trim();

  if (!story) {
    alert("Please write your story first.");
    return;
  }

  const status = document.getElementById("status");

  status.textContent = "🎬 Creating your video...";

  setTimeout(() => {
    alert("The video creator is ready for the next step!");
    status.textContent = "✨ Video creation started!";
  }, 1000);
}
</script>

</body>
</html>
